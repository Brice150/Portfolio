<app-hero />

<section class="section shell" [attr.aria-label]="t().home.keyFigures">
  <app-highlight-grid [items]="highlights" />
</section>

<app-tech-marquee [items]="technologies()" [label]="t().home.marqueeLabel" />

<section id="profil" class="section shell">
  <app-profile-intro />
</section>

<section class="section shell" aria-labelledby="principes-titre">
  <app-section-header
    [eyebrow]="t().home.principlesEyebrow"
    [heading]="t().home.principlesHeading"
    [lead]="t().home.principlesLead"
    centered
  />

  <ul class="principles">
    @for (principle of principles; track principle.icon; let i = $index) {
      <li class="principle card-hover" [appReveal]="i * 90">
        <span class="principle-icon" aria-hidden="true">
          <app-icon [name]="principle.icon" size="1.2em" />
        </span>
        <h3>{{ tr(principle.title) }}</h3>
        <p class="justified">{{ tr(principle.description) }}</p>
      </li>
    }
  </ul>
</section>


<section class="section shell">
  <app-section-header
    [eyebrow]="t().home.collaborationEyebrow"
    [heading]="tr(collaboration.title)"
    [lead]="t().home.collaborationLead"
    centered
  />

  <ul class="collab">
    @for (point of collaboration.points; track point.icon; let i = $index) {
      <li class="collab-item card-hover" [appReveal]="i * 80">
        <app-icon [name]="point.icon" size="1.2em" />
        <div>
          <h3>{{ tr(point.title) }}</h3>
          <p class="justified">{{ tr(point.text) }}</p>
        </div>
      </li>
    }
  </ul>
</section>
