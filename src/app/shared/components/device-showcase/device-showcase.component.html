@let shots = project().shots;
@let name = tr(project().name);

<div class="stage">
  <div class="glow" aria-hidden="true"></div>

  <app-device-frame
    class="laptop-slot"
    variant="desktop"
    [src]="shots.desktop"
    [alt]="format(t().device.desktopViewOf, { name })"
    [url]="displayUrl()"
  />

  <app-device-frame
    class="phone-slot"
    variant="phone"
    [src]="shots.mobile"
    [alt]="format(t().device.mobileViewOf, { name })"
  />
</div>
