<header class="bar" [class.is-scrolled]="scrolled()">
  <div class="progress" aria-hidden="true">
    <span class="progress-fill" [style.width.%]="progress()"></span>
  </div>

  <div class="inner shell-wide">
    <a routerLink="/" class="brand" [attr.aria-label]="format(t().header.brandHome, { name: profile.fullName })">
      <img
        [src]="imagePath + 'logo.webp'"
        alt=""
        class="avatar"
        width="76"
        height="76"
        fetchpriority="high"
        decoding="async"
      />
      <span class="brand-text">
        <span class="brand-name">{{ profile.fullName }}</span>
        <span class="brand-role">{{ tr(profile.role) }}</span>
      </span>
    </a>

    <nav class="desktop-nav" [attr.aria-label]="t().header.mainNav">
      <ul>
        @for (item of navItems; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="is-active"
              #link="routerLinkActive"
              [routerLinkActiveOptions]="{ exact: !!item.exact }"
              [attr.aria-current]="link.isActive ? 'page' : null"
            >
              {{ tr(item.label) }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="actions">
      <app-language-switcher />
      <app-settings-panel />

      <button
        type="button"
        class="burger"
        [class.is-open]="menuOpen()"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="menu-mobile"
        [attr.aria-label]="menuOpen() ? t().header.closeMenu : t().header.openMenu"
        [attr.title]="menuOpen() ? t().header.closeMenu : t().header.openMenu"
      >
        <span class="burger-line" aria-hidden="true"></span>
        <span class="burger-line" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>

<div class="overlay" [class.is-open]="menuOpen()" (click)="closeMenu()" aria-hidden="true"></div>

<div
  id="menu-mobile"
  class="mobile-menu"
  [class.is-open]="menuOpen()"
  [attr.inert]="menuOpen() ? null : ''"
  cdkTrapFocus
  [cdkTrapFocusAutoCapture]="menuOpen()"
>
  <nav [attr.aria-label]="t().header.mobileNav">
    <ul>
      @for (item of navItems; track item.path; let i = $index) {
        <li [style.--i]="i">
          <a
            [routerLink]="item.path"
            routerLinkActive="is-active"
            #mobileLink="routerLinkActive"
            [routerLinkActiveOptions]="{ exact: !!item.exact }"
            [attr.aria-current]="mobileLink.isActive ? 'page' : null"
            (click)="closeMenu()"
          >
            <app-icon [name]="item.icon" size="1.35em" />
            <span class="labels">
              <span class="label">{{ tr(item.label) }}</span>
              <span class="hint">{{ tr(item.hint) }}</span>
            </span>
            <app-icon name="chevron-right" size="1.1em" />
          </a>
        </li>
      }
    </ul>
  </nav>
</div>
