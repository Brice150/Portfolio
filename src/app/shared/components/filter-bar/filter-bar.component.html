<div class="filters" role="group" [attr.aria-label]="label()">
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="filter"
      [class.is-active]="active() === option.value"
      [attr.aria-pressed]="active() === option.value"
      (click)="changed.emit(option.value)"
    >
      @if (option.icon) {
        <app-icon [name]="option.icon" size="1em" />
      }
      <span>{{ option.label }}</span>
    </button>
  }
</div>
