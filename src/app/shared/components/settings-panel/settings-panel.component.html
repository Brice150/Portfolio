<button
  type="button"
  class="trigger"
  [class.is-open]="open()"
  (click)="toggle()"
  [attr.aria-expanded]="open()"
  aria-controls="settings-popover"
  [attr.aria-label]="t().settings.trigger"
  [title]="t().settings.trigger"
>
  <app-icon name="palette" size="1.15em" />
</button>

<div
  id="settings-popover"
  class="popover"
  [class.is-open]="open()"
  [attr.inert]="open() ? null : ''"
  role="dialog"
  [attr.aria-label]="t().settings.dialog"
  cdkTrapFocus
  [cdkTrapFocusAutoCapture]="open()"
>
  <div class="head">
    <h2>{{ t().settings.heading }}</h2>
    <button
      type="button"
      class="close"
      (click)="close()"
      [attr.aria-label]="t().settings.close"
      [title]="t().settings.close"
    >
      <app-icon name="close" size="1.05em" />
    </button>
  </div>

  <fieldset class="group">
    <legend>{{ t().settings.theme }}</legend>
    <div class="segmented">
      @for (option of themeOptions; track option.value) {
        <button
          type="button"
          [class.is-selected]="theme() === option.value"
          (click)="selectTheme(option.value)"
          [attr.aria-pressed]="theme() === option.value"
        >
          <app-icon [name]="option.icon" size="1.05em" />
          <span>{{ t().theme[option.value] }}</span>
        </button>
      }
    </div>
  </fieldset>

  <fieldset class="group">
    <legend>{{ t().settings.accent }}</legend>
    <div class="swatches">
      @for (option of accentOptions; track option.value) {
        <button
          type="button"
          class="swatch"
          [class.is-selected]="accent() === option.value"
          [style.--swatch]="option.swatch"
          (click)="selectAccent(option.value)"
          [attr.aria-pressed]="accent() === option.value"
          [attr.aria-label]="
            format(t().settings.accentAria, { label: t().theme[option.value] })
          "
          [title]="t().theme[option.value]"
        >
          <span class="dot" aria-hidden="true"></span>
        </button>
      }
    </div>
  </fieldset>

  <fieldset class="group">
    <legend>{{ t().settings.motion }}</legend>
    <button
      type="button"
      class="switch"
      (click)="toggleMotion()"
      [attr.aria-pressed]="motionEnabled()"
    >
      <span class="switch-label">
        <app-icon name="motion" size="1.05em" />
        <span>{{
          motionEnabled() ? t().settings.motionOn : t().settings.motionOff
        }}</span>
      </span>
      <span class="track" [class.is-on]="motionEnabled()" aria-hidden="true">
        <span class="thumb"></span>
      </span>
    </button>
    <p class="note">{{ t().settings.motionNote }}</p>
  </fieldset>
</div>
