<button
  type="button"
  class="trigger"
  [class.is-open]="open()"
  (click)="toggle()"
  [attr.aria-expanded]="open()"
  aria-controls="settings-popover"
  aria-label="Personnaliser l’affichage"
  title="Personnaliser l’affichage"
>
  <app-icon name="palette" size="1.15em" />
</button>

<div
  id="settings-popover"
  class="popover"
  [class.is-open]="open()"
  [attr.inert]="open() ? null : ''"
  role="dialog"
  aria-label="Préférences d’affichage"
  cdkTrapFocus
  [cdkTrapFocusAutoCapture]="open()"
>
  <div class="head">
    <h2>Affichage</h2>
    <button type="button" class="close" (click)="close()" aria-label="Fermer les préférences" title="Fermer les préférences">
      <app-icon name="close" size="1.05em" />
    </button>
  </div>

  <fieldset class="group">
    <legend>Thème</legend>
    <div class="segmented">
      @for (option of themeOptions; track option.value) {
        <button
          type="button"
          [class.is-selected]="theme() === option.value"
          (click)="selectTheme(option.value)"
          [attr.aria-pressed]="theme() === option.value"
        >
          <app-icon [name]="option.icon" size="1.05em" />
          <span>{{ option.label }}</span>
        </button>
      }
    </div>
  </fieldset>

  <fieldset class="group">
    <legend>Couleur d’accent</legend>
    <div class="swatches">
      @for (option of accentOptions; track option.value) {
        <button
          type="button"
          class="swatch"
          [class.is-selected]="accent() === option.value"
          [style.--swatch]="option.swatch"
          (click)="selectAccent(option.value)"
          [attr.aria-pressed]="accent() === option.value"
          [attr.aria-label]="'Couleur ' + option.label"
          [title]="option.label"
        >
          <span class="dot" aria-hidden="true"></span>
        </button>
      }
    </div>
  </fieldset>

  <fieldset class="group">
    <legend>Animations</legend>
    <button
      type="button"
      class="switch"
      (click)="toggleMotion()"
      [attr.aria-pressed]="motionEnabled()"
    >
      <span class="switch-label">
        <app-icon name="motion" size="1.05em" />
        <span>{{ motionEnabled() ? 'Activées' : 'Réduites' }}</span>
      </span>
      <span class="track" [class.is-on]="motionEnabled()" aria-hidden="true">
        <span class="thumb"></span>
      </span>
    </button>
    <p class="note">
      Les préférences système de réduction de mouvement sont respectées en priorité.
    </p>
  </fieldset>
</div>
