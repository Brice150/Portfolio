<section class="section shell wrapper">
  <p class="code" aria-hidden="true">404</p>

  <h1>{{ t().notFound.heading }}</h1>
  <p class="lead justified">{{ t().notFound.lead }}</p>

  <ul class="links">
    @for (item of navItems; track item.path) {
      <li>
        <a [routerLink]="item.path" class="link">
          <app-icon [name]="item.icon" size="1.2em" />
          <span class="link-text">
            <span class="link-label">{{ tr(item.label) }}</span>
            <span class="link-hint">{{ tr(item.hint) }}</span>
          </span>
          <app-icon name="arrow-right" size="1.05em" />
        </a>
      </li>
    }
  </ul>
</section>
