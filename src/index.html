    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add('js');

        // Posée avant l'amorçage : le `lang` ne doit jamais être lu erroné.
        try {
          var lang = localStorage.getItem('portfolio-lang');

          if (lang !== 'fr' && lang !== 'en') {
            lang =
              (navigator.language || 'fr').toLowerCase().indexOf('en') === 0
                ? 'en'
                : 'fr';
          }

          root.setAttribute('lang', lang);
        } catch (error) {
          root.setAttribute('lang', 'fr');
        }

        try {
          var stored = JSON.parse(
            localStorage.getItem('portfolio-preferences') || '{}',
          );

          if (stored.theme && stored.theme !== 'system') {
            root.setAttribute('data-theme', stored.theme);
          }

          root.setAttribute('data-accent', stored.accent || 'azure');
          root.setAttribute(
            'data-motion',
            stored.motion === 'reduced' ? 'reduced' : 'full',
          );
        } catch (error) {
          root.setAttribute('data-accent', 'azure');
        }
      })();
    </script>
